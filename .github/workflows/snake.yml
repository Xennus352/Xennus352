name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .github/workflows/snake.yml

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      - name: Read profile settings
        id: profile
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = json.loads(Path('profile.json').read_text())
          username = p['github_username'] or os.environ['GITHUB_REPOSITORY_OWNER']
          accent = p['theme']['accent']
          if not re.fullmatch(r'[A-Za-z0-9-]+', username):
              raise ValueError('Invalid GitHub username')
          if not re.fullmatch(r'[A-Fa-f0-9]{6}', accent):
              raise ValueError('Invalid accent color')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'username={username}', file=output)
              print(f'accent={accent}', file=output)
              print(f'enabled={str(p["sections"]["snake"]).lower()}', file=output)
          PY
      - name: generate github-contribution-grid-snake.svg
        if: steps.profile.outputs.enabled == 'true'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ steps.profile.outputs.username }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23${{ steps.profile.outputs.accent }}
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23${{ steps.profile.outputs.accent }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: push github-contribution-grid-snake.svg to the output branch
        if: steps.profile.outputs.enabled == 'true'
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
