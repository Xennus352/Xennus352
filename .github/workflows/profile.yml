name: Update profile README

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - scripts/render_profile.py
      - scripts/github_stats.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/render_profile.py
      - name: Fetch real GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/github_stats.py
      - name: Read animation settings
        id: profile
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = json.loads(Path('profile.json').read_text())
          username = p['github_username'] or os.environ['GITHUB_REPOSITORY_OWNER']
          accent = p['theme']['accent']
          if not re.fullmatch(r'[A-Za-z0-9-]+', username):
              raise ValueError('Invalid GitHub username')
          if not re.fullmatch(r'[A-Fa-f0-9]{6}', accent):
              raise ValueError('Invalid accent color')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'username={username}', file=output)
              print(f'accent={accent}', file=output)
              print(f'enabled={str(p["sections"]["snake"]).lower()}', file=output)
          PY
      - name: Generate contribution snake
        if: steps.profile.outputs.enabled == 'true'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ steps.profile.outputs.username }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=%23${{ steps.profile.outputs.accent }}
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23${{ steps.profile.outputs.accent }}
      - name: Save README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh profile and GitHub activity"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
